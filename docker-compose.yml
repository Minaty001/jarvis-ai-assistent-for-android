version: '3.8'

services:
  jarvis:
    build: .
    container_name: jarvis-assistant
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./voices:/app/voices
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/jarvis.db
      - MODELS_DIR=/app/models
      - VOICES_DIR=/app/voices
      - LOGS_DIR=/app/logs
    # Running in web mode with text inputs since audio devices are typically not shared inside a standard container
    command: ["python", "-m", "jarvis", "--web", "--no-voice"]
